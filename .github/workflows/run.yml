name: Run

on:
  workflow_dispatch:
    inputs:
      deb:
        description: "Direct URL to deb file"
        required: true

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Convert deb to IPA
        run: |
          curl -L -o ${{ github.workspace }}/app.deb "${{ github.event.inputs.deb }}"
          dpkg-deb -X ${{ github.workspace }}/app.deb ${{ github.workspace }}/app

          mkdir -p ${{ github.workspace }}/ipa/Payload
          cp -R ${{ github.workspace }}/app/Applications/* ${{ github.workspace }}/ipa/Payload
          
          cd ${{ github.workspace }}/ipa
          zip -r ${{ github.workspace }}/App.ipa .

      - name: Inspect deb
        run: |
          dpkg-deb -c app.deb
          dpkg-deb -e app.deb control
          ls control
          cat control/postinst 2>/dev/null || true
          strings app/Applications/Aemulo.app/Aemulo | grep -E '^/(var|private|Library|usr|System)' | sort -u

    - name: Show entitlements
        run: |
          sudo apt-get install -y ldid
          ldid -e app/Applications/Aemulo.app/Aemulo
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: App
          path: ${{ github.workspace }}/App.ipa
