name: Run

on:
  workflow_dispatch:
    inputs:
      deb:
        description: "Direct URL to deb file"
        required: true

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Download and extract deb
        env:
          DEB_URL: ${{ github.event.inputs.deb }}
        run: |
          curl -L -o app.deb "$DEB_URL"
          dpkg-deb -x app.deb app

      - name: Inspect deb
        continue-on-error: true
        run: |
          echo "=== Files in deb ==="
          dpkg-deb -c app.deb

          echo "=== Control files / install scripts ==="
          dpkg-deb -e app.deb control
          ls control
          cat control/postinst 2>/dev/null || true

          echo "=== Hardcoded system paths in binaries ==="
          for bin in app/Applications/*.app/*; do
            if [ -f "$bin" ] && [ -x "$bin" ]; then
              echo "--- $bin ---"
              strings "$bin" | grep -E '^/(var|private|Library|usr|System)' | sort -u
            fi
          done

      - name: Show entitlements
        continue-on-error: true
        run: |
          curl -L -o ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
          chmod +x ldid
          for bin in app/Applications/*.app/*; do
            if [ -f "$bin" ] && [ -x "$bin" ]; then
              echo "--- $bin ---"
              ./ldid -e "$bin" || true
              echo "--- fallback: entitlement-style strings ---"
              strings -n 6 "$bin" | grep -E 'com\.apple\.' | sort -u
            fi
          done

      - name: Build IPA
        run: |
          mkdir -p ipa/Payload

          # Find the .app bundle (works for rootful and rootless debs)
          APP=$(find app -type d -name "*.app" -path "*Applications*" | head -n 1)
          if [ -z "$APP" ]; then
            echo "No .app bundle found in deb"
            exit 1
          fi
          echo "Using bundle: $APP"
          cp -R "$APP" ipa/Payload/

          cd ipa
          zip -r ../App.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: App
          path: App.ipa
